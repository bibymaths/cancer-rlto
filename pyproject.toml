[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cancer-rlto"
version = "0.1.0"
description = "Cancer-adapted RLTO-inspired model for deterministic robustness-load trade-off analysis, optimization, and diagnostic plotting."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Abhinav Mishra", email = "mishraabhinav36@gmail.com" },
]
keywords = [
  "bioinformatics",
  "cancer-systems-biology",
  "optimization",
  "omics",
  "robustness",
  "mathematical-modeling",
  "rlto",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/<YOUR_GITHUB_USERNAME>/<YOUR_REPOSITORY_NAME>"
Documentation = "https://<YOUR_GITHUB_USERNAME>.github.io/<YOUR_REPOSITORY_NAME>/"
Repository = "https://github.com/<YOUR_GITHUB_USERNAME>/<YOUR_REPOSITORY_NAME>"
Issues = "https://github.com/<YOUR_GITHUB_USERNAME>/<YOUR_REPOSITORY_NAME>/issues"

[dependency-groups]
dev = [
  "mypy>=1.19.1",
  "ruff>=0.15.7",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "mkdocs-git-revision-date-localized-plugin>=1.2",
  "mkdocs-minify-plugin>=0.8",
  "pygments>=2.18",
  "pymdown-extensions>=10.8",
  "griffe>=0.49",
]

[tool.hatch.build]
dev-mode-dirs = ["."]
exclude = [
  "/.git",
  "/.github",
  "/.venv",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/site",
  "/build",
  "/dist",
  "__pycache__",
  "*.py[cod]",
]

[tool.hatch.build.targets.wheel]
only-include = ["rlto_model.py"]

[tool.hatch.build.targets.sdist]
include = [
  "/rlto_model.py",
  "/README.md",
  "/pyproject.toml",
  "/LICENSE*",
  "/NOTICE",
  "/CITATION.cff",
  "/TERMS_OF_USE.md",
  "/docs",
  "/mkdocs.yml",
  "/requirements-docs.txt",
  "/.github/workflows",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
exclude = [
  "docs",
  "site",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["rlto_model"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["rlto_model.py"]
pretty = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = [
  "^docs/",
  "^site/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["rlto_model"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false