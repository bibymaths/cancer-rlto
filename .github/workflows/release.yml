name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build release from tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy matplotlib

      - name: Install docs dependencies
        run: |
          pip install -r requirements-docs.txt

      - name: Build documentation artifact
        run: |
          mkdocs build --strict
          tar -czf site.tar.gz site

      - name: Generate release notes
        id: notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          {
            echo "release_body<<EOF"
            echo "Release ${TAG_NAME}"
            echo
            echo "## Included"
            echo "- Source snapshot for tag ${TAG_NAME}"
            echo "- Built MkDocs site artifact"
            echo
            echo "## Notes"
            echo "- Update changelog entries in docs/changelog.md as part of each tagged release."
            echo "- Extend this workflow if you later publish wheels or source distributions."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ steps.notes.outputs.release_body }}
          files: |
            site.tar.gz