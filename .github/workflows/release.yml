name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release from tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Sync project with docs dependencies
        run: uv sync --group docs --locked

      - name: Build docs artifact
        run: |
          uv run mkdocs build --strict
          tar -czf site.tar.gz site

      - name: Build distribution artifacts
        run: uv build

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          {
            echo "release_body<<EOF"
            echo "Release ${TAG_NAME}"
            echo
            echo "## Included"
            echo "- Source snapshot for tag ${TAG_NAME}"
            echo "- Built Python distribution artifacts"
            echo "- Built MkDocs site artifact"
            echo
            echo "## Notes"
            echo "- Update docs/changelog.md for each tagged release."
            echo "- This workflow assumes version tags follow the form v*."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: ${{ steps.notes.outputs.release_body }}
          files: |
            dist/*
            site.tar.gz